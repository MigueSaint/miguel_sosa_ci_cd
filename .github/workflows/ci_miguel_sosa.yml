name: CI/CD Miguel Sosa

on:
  push:
    branches:
      - miguel_sosa
  pull_request:
    branches:
      - miguel_sosa

permissions:
  contents: read

jobs:
  build-and-push-miguel-sosa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: miguesg
          password: Panido483

      - name: Build and push Docker image Miguel Sosa
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: docker.io/miguesg/miguel_sosa:1.0.0
